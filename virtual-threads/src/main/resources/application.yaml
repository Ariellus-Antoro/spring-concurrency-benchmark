server:
  port: 8080

spring:
  application:
    name: virtual-threads
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:ticket_db_virtual}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:arabawa}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool=size: 10
      minimum-idle: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect